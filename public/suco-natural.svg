<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FAF8F8"/>
  <circle cx="150" cy="150" r="110" fill="#FFF3EB" opacity="0.6"/>
  <!-- Glass cup -->
  <polygon points="120,80 180,80 170,225 130,225" fill="#FFA34D"/>
  <!-- Top juice surface -->
  <ellipse cx="150" cy="80" rx="30" ry="8" fill="#FF881E"/>
  <!-- Straw -->
  <line x1="165" y1="50" x2="145" y2="170" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <!-- Ice cubes -->
  <rect x="135" y="105" width="16" height="16" rx="3" fill="#FFE5D1" opacity="0.6"/>
  <rect x="150" y="130" width="14" height="14" rx="3" fill="#FFE5D1" opacity="0.6"/>
  <!-- Label -->
  <text x="150" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" letter-spacing="1">SUCO 450ml</text>
</svg>
