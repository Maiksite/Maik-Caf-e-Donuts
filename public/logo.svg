<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Definition of gradients & filters -->
  <defs>
    <!-- Dough base color -->
    <radialGradient id="doughGrad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#E5AF77"/>
      <stop offset="95%" stop-color="#C58954"/>
    </radialGradient>
    
    <!-- Chocolate frosting -->
    <linearGradient id="chocoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E3125"/>
      <stop offset="100%" stop-color="#321F17"/>
    </linearGradient>

    <!-- Pink frosting (brand vibrant rose) -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F294B2"/>
      <stop offset="100%" stop-color="#DE678D"/>
    </linearGradient>
  </defs>

  <g id="brand-logo" transform="translate(0, 5)">
    <!-- Top Wordmark: Maik -->
    <g id="wordmark-maik" fill="#34251F">
      <!-- M -->
      <path d="M 125 140 L 125 90 Q 125 84 132 85 L 148 122 L 165 85 Q 172 84 172 90 L 172 140 Q 172 144 167 144 Q 162 144 162 140 L 162 104 L 149 133 Q 146 138 143 133 L 134 104 L 134 140 Q 134 144 129 144 Q 125 144 125 140 Z" />
      
      <!-- a -->
      <path d="M 188 116 Q 198 108 211 113 Q 220 117 220 128 L 220 140 Q 220 144 216 144 Q 212 144 212 140 L 212 135 Q 205 144 194 144 Q 183 144 180 133 Q 178 123 188 116 Z M 212 126 L 212 124 Q 212 118 206 117 Q 198 116 193 121 Q 189 125 191 131 Q 193 136 200 136 Q 207 136 212 126 Z" />
      
      <!-- i with crown sparkle -->
      <path d="M 235 113 L 235 140 Q 235 144 231 144 Q 227 144 227 140 L 227 113 Q 227 109 231 109 Q 235 109 235 113 Z" />
      <!-- Crown sparkle above i -->
      <circle cx="231" cy="94" r="3.2" fill="#DE678D" />
      <circle cx="223" cy="88" r="2" fill="#DE678D" />
      <circle cx="239" cy="88" r="2" fill="#DE678D" />
      <line x1="231" y1="99" x2="231" y2="103" stroke="#DE678D" stroke-width="1.8" stroke-linecap="round" />
      <line x1="225" y1="95" x2="228" y2="99" stroke="#DE678D" stroke-width="1.5" stroke-linecap="round" />
      <line x1="237" y1="95" x2="234" y2="99" stroke="#DE678D" stroke-width="1.5" stroke-linecap="round" />

      <!-- k -->
      <path d="M 252 82 L 252 140 Q 252 144 248 144 Q 244 144 244 140 L 244 82 Q 244 78 248 78 Q 252 78 252 82 Z M 252 122 L 268 110 Q 272 107 274 111 Q 276 114 271 118 L 258 127 L 273 140 Q 276 143 273 146 Q 269 148 266 144 L 252 131 Z" />
    </g>

    <!-- Center Emblem: Coffee Cup + Dual Donut -->
    <g id="center-emblem">
      <!-- Saucer & Steam Base -->
      <path d="M 125 258 C 160 274 240 274 275 258" fill="none" stroke="#34251F" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 138 266 C 170 278 230 278 262 266" fill="none" stroke="#34251F" stroke-width="3" stroke-linecap="round" />
      
      <!-- Cup Handle right -->
      <path d="M 258 178 C 295 180 305 232 254 244" fill="none" stroke="#34251F" stroke-width="6.5" stroke-linecap="round" />

      <!-- Cup Rim & Outline -->
      <path d="M 142 165 C 120 205 132 252 200 255 C 255 255 272 215 258 165" fill="none" stroke="#34251F" stroke-width="5" stroke-linecap="round" />

      <!-- Donut Dough Background Base -->
      <circle cx="200" cy="200" r="56" fill="url(#doughGrad)" stroke="#34251F" stroke-width="2.5" />

      <!-- Left Half Donut: Chocolate Frosting with wavy dripped edge -->
      <path d="M 200 144 C 165 144 144 170 144 200 C 144 230 166 256 200 256 C 196 242 201 228 196 218 C 194 206 195 194 196 182 C 201 170 196 156 200 144 Z" fill="url(#chocoGrad)" />

      <!-- Right Half Donut: Vibrant Pink Frosting with wavy dripped edge -->
      <path d="M 200 144 C 235 144 256 170 256 200 C 256 230 234 256 200 256 C 204 242 199 228 204 218 C 206 206 205 194 204 182 C 199 170 204 156 200 144 Z" fill="url(#pinkGrad)" />

      <!-- Donut Center Hole -->
      <circle cx="200" cy="200" r="18" fill="#FAF8F5" stroke="#34251F" stroke-width="3" />

      <!-- Chocolate Sprinkles (White / Crisp Cream) -->
      <g stroke="#FFF" stroke-width="2.6" stroke-linecap="round" opacity="0.95">
        <line x1="162" y1="168" x2="168" y2="174" />
        <line x1="152" y1="188" x2="158" y2="186" />
        <line x1="172" y1="184" x2="177" y2="190" />
        <line x1="158" y1="212" x2="165" y2="209" />
        <line x1="175" y1="222" x2="182" y2="228" />
        <line x1="184" y1="165" x2="187" y2="172" />
        <line x1="165" y1="236" x2="171" y2="232" />
      </g>

      <!-- Pink Sprinkles (White & Crisp dashes) -->
      <g stroke="#FFF" stroke-width="2.6" stroke-linecap="round" opacity="0.95">
        <line x1="235" y1="168" x2="229" y2="173" />
        <line x1="244" y1="188" x2="238" y2="185" />
        <line x1="225" y1="182" x2="220" y2="188" />
        <line x1="240" y1="212" x2="233" y2="210" />
        <line x1="222" y1="224" x2="216" y2="228" />
        <line x1="214" y1="166" x2="212" y2="173" />
        <line x1="232" y1="236" x2="227" y2="231" />
      </g>

      <!-- Shading detail on donut hole -->
      <path d="M 188 190 A 18 18 0 0 1 200 182" fill="none" stroke="#34251F" stroke-width="1.8" opacity="0.4" />
    </g>

    <!-- Bottom Wordmark: Café e Donuts -->
    <text x="200" y="306" 
          text-anchor="middle" 
          font-family="'Playfair Display', Georgia, serif" 
          font-size="30" 
          font-weight="700" 
          letter-spacing="0.5" 
          fill="#34251F">
      Café e Donuts
    </text>
  </g>
</svg>
